name = "proofs"
version = "0.1.0"
defaultTargets = ["BuildingBlocks"]

# Mathlib is pinned by revision. Run `lake exe cache get` before `lake build`
# to download the prebuilt Mathlib oleans for this revision.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[lean_lib]]
name = "BuildingBlocks"
srcDir = "formalization"
leanOptions = { autoImplicit = true, relaxedAutoImplicit = true }
